<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#1b1a17" />
  <title>Tử Vi Đẩu Số</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="pyodide/pyodide.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Tử Vi Đẩu Số</h1>
    <span id="engine-status" class="status">Đang khởi động…</span>
    <span id="build-tag" class="status build-tag">build __BUILD__</span>
  </header>

  <main>
    <!-- 1. Lập lá số -->
    <section id="view-la-so" class="view active">
      <form id="form-birth" class="card form-grid" autocomplete="off">
        <label class="wide">Họ tên
          <input id="f-ten" type="text" maxlength="60" placeholder="Không bắt buộc" />
        </label>
        <label>Ngày
          <input id="f-ngay" type="number" min="1" max="31" required />
        </label>
        <label>Tháng
          <input id="f-thang" type="number" min="1" max="12" required />
        </label>
        <label>Năm
          <input id="f-nam" type="number" min="1800" max="2200" required />
        </label>
        <label>Lịch
          <select id="f-lich">
            <option value="duong">Dương lịch</option>
            <option value="am">Âm lịch</option>
          </select>
        </label>
        <label>Giới tính
          <select id="f-gioi">
            <option value="Nam">Nam</option>
            <option value="Nữ">Nữ</option>
          </select>
        </label>
        <label>Giờ sinh
          <select id="f-gio"></select>
        </label>
        <label>Múi giờ (UTC)
          <input id="f-tz" type="number" step="0.5" min="-12" max="14" value="7" />
        </label>
        <div class="actions wide">
          <button type="submit" class="btn primary" id="btn-lap">Lập lá số</button>
          <button type="button" class="btn" id="btn-save" disabled>Lưu hồ sơ</button>
        </div>
      </form>

      <div id="la-so-result" class="hidden">
        <div class="card" id="summary"></div>
        <div id="han-strip"></div>
        <div class="board-wrap"><div id="board" class="board"></div></div>
        <p class="hint">T = tháng âm (Lưu nguyệt) · N = ngày âm (Lưu nhật) · G = giờ (Lưu thời). Số được tô là tháng/ngày/giờ đang xem. Chạm một cung để xem chi tiết.</p>
        <div class="card" id="palace-detail"></div>
      </div>
      <div id="la-so-empty" class="card empty">Nhập ngày sinh và bấm <b>Lập lá số</b>.</div>
    </section>

    <!-- 2. Vận hạn -->
    <section id="view-van" class="view">
      <div id="van-empty" class="card empty">Hãy lập lá số trước.</div>
      <div id="van-result" class="hidden">
        <form id="form-view" class="card form-grid" autocomplete="off">
          <label>Ngày xem (dương lịch)
            <input id="v-date" type="date" required />
          </label>
          <label>Giờ xem (cho Lưu thời)
            <select id="v-gio"></select>
          </label>
          <div class="actions wide">
            <button type="submit" class="btn primary">Tính hạn theo ngày xem</button>
            <button type="button" class="btn" id="btn-today">Hôm nay</button>
          </div>
        </form>
        <div class="card" id="han-cards"></div>
        <div id="luu-bang"></div>
        <div class="card table-card" id="van-table"></div>
      </div>
    </section>

    <!-- 3. Cách cục -->
    <section id="view-cach" class="view">
      <div id="cach-empty" class="card empty">Hãy lập lá số trước.</div>
      <div id="cach-result"></div>
    </section>

    <!-- 4. Danh bạ sao -->
    <section id="view-sao" class="view">
      <div id="sao-empty" class="card empty">Hãy lập lá số trước.</div>
      <div id="sao-result" class="hidden">
        <input id="sao-search" class="search" type="search" placeholder="Tìm sao (ví dụ: Tử vi, Hóa Lộc…)" />
        <div id="sao-list"></div>
      </div>
    </section>

    <!-- 5. Hồ sơ -->
    <section id="view-ho-so" class="view">
      <div id="ho-so-list"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Chức năng">
    <button class="tab active" data-view="view-la-so">Lá số</button>
    <button class="tab" data-view="view-van">Vận hạn</button>
    <button class="tab" data-view="view-cach">Cách cục</button>
    <button class="tab" data-view="view-sao">Danh bạ sao</button>
    <button class="tab" data-view="view-ho-so">Hồ sơ</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
